<style>
:root {

}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;line-height:1.55}
.wrap{max-width:920px;margin:auto;padding:18px 14px 80px}
.toplink{display:inline-block;margin-bottom:8px;color:var(--accent);text-decoration:none;font-weight:600}
h1{font-size:26px;line-height:1.3;margin:6px 0 8px}
.lead{margin:0 0 16px;color:var(--muted)}
.toolbar{position:sticky;top:0;z-index:20;background:rgba(244,246,248,.96);backdrop-filter:blur(7px);padding:10px 0 12px}
.controls{display:grid;grid-template-columns:1fr 170px 150px;gap:8px}
input,select{width:100%;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--text)}
.summary{display:flex;gap:10px;flex-wrap:wrap;margin:9px 0 0;color:var(--muted);font-size:14px}
.pager{display:flex;gap:6px;overflow-x:auto;padding:6px 0 4px;scrollbar-width:thin}
.pager button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 10px;font-size:13px}
.pager button.active{background:var(--text);color:#fff;border-color:var(--text)}
.cards{display:grid;gap:12px;margin-top:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:13px;margin-bottom:7px}
.jp{font-size:20px;font-weight:750;letter-spacing:.01em;margin:3px 0 10px}
.cat{font-size:12px;padding:3px 8px;border-radius:999px;background:#eef2f6}
.answer-btn{width:100%;border:1px solid var(--accent);color:var(--accent);background:#f8fbff;font-weight:700;border-radius:10px;padding:10px;font-size:15px}
.answer{display:none;margin-top:10px;padding:12px;border-radius:10px;background:#f7f9fc}
.answer.show{display:block}
.es{font-size:21px;font-weight:750}
.speak{margin-top:8px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 10px;font-size:14px}
.statuses{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:11px}
.statuses button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 5px;font-size:13px;font-weight:650}
.statuses button.sel[data-s="new"]{background:#eef2f6}
.statuses button.sel[data-s="review"]{background:#fff1df;color:var(--review);border-color:#f0c98b}
.statuses button.sel[data-s="done"]{background:#e7f6ef;color:var(--done);border-color:#9bd5ba}
.navline{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:18px 0}
.navline button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 13px;font-weight:700}
.empty{display:none;padding:30px 10px;text-align:center;color:var(--muted)}
.footnote{margin-top:24px;color:var(--muted);font-size:12px}
@media(max-width:680px){
  .wrap{padding:12px 10px 60px}
  h1{font-size:22px}
  .controls{grid-template-columns:1fr 1fr}
  .controls input{grid-column:1/-1}
  .jp{font-size:19px}
  .es{font-size:20px}
}
</style>
</head>

 "外的妥当性をめぐる見解を精緻化する", "es": "matizar las posiciones en torno a la validez externa", "cat": "論述・分析", "level": "C2"}, {"ja": "内的妥当性をめぐる見解を精緻化する", "es": "matizar las posiciones en torno a la validez interna", "cat": "論述・分析", "level": "C2"}, {"ja": "結果の頑健性をめぐる見解を精緻化する", "es": "matizar las posiciones en torno a la robustez de los resultados", "cat": "論述・分析", "level": "C2"}, {"ja": "データの再現可能性をめぐる見解を精緻化する", "es": "matizar las posiciones en torno a la reproducibilidad de los datos", "cat": "論述・分析", "level": "C2"}, {"ja": "政策の費用対効果をめぐる見解を精緻化する", "es": "matizar las posiciones en torno a la relación coste-eficacia de la política", "cat": "論述・分析", "level": "C2"}, {"ja": "規制遵守コストをめぐる見解を精緻化する", "es": "matizar las posiciones en torno a los costes de cumplimiento", "cat": "論述・分析", "level": "C2"}, {"ja": "財政余地をめぐる見解を精緻化する", "es": "matizar las posiciones en torno a el margen fiscal", "cat": "論述・分析", "level": "C2"}, {"ja": "購買力の変化をめぐる見解を精緻化する", "es": "matizar las posiciones en torno a la evolución del poder adquisitivo", "cat": "論述・分析", "level": "C2"}, {"ja": "制度的信頼をめぐる見解を精緻化する", "es": "matizar las posiciones en torno a la confianza institucional", "cat": "論述・分析", "level": "C2"}, {"ja": "政策の一貫性をめぐる見解を精緻化する", "es": "matizar las posiciones en torno a la coherencia de las políticas", "cat": "論述・分析", "level": "C2"}];
const STORAGE_KEY="spanish_vocab_c2_v1";
const PAGE_SIZE=50;
let page=0;
let state={};
try{ state=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}'); }catch(e){state={}}

const $=s=>document.querySelector(s);
const normalize=s=>(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function getStatus(i){return state[i]||'new'}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state)); $('#saved').textContent='学習状態：保存済み'}catch(e){$('#saved').textContent='学習状態：保存できません'}}

function filtered(){
  const q=normalize($('#q').value.trim()), cat=$('#cat').value, st=$('#status').value;
  return DATA.map((x,i)=>({...x,_i:i})).filter(x=>{
    const hit=!q || normalize(x.ja+' '+x.es).includes(q);
    return hit && (!cat||x.cat===cat) && (!st||getStatus(x._i)===st);
  });
}

function speak(text){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='es-ES'; u.rate=.9;
  const voices=speechSynthesis.getVoices();
  const v=voices.find(v=>v.lang && v.lang.toLowerCase().startsWith('es-es')) ||
          voices.find(v=>v.lang && v.lang.toLowerCase().startsWith('es'));
  if(v)u.voice=v;
  speechSynthesis.speak(u);
}

function card(x){
  const st=getStatus(x._i);
  return `<article class="card">
    <div class="meta"><span>No. ${x._i+1}</span><span class="cat">${x.level} ${escapeHtml(x.cat)}</span></div>
    <div class="jp">${escapeHtml(x.ja)}</div>
    <button class="answer-btn" data-action="answer">スペイン語を見る</button>
    <div class="answer"><div class="es" lang="es">${escapeHtml(x.es)}</div>
      <button class="speak" data-action="speak">🔊 発音</button>
    </div>
    <div class="statuses">
      <button data-action="status" data-s="new" class="${st==='new'?'sel':''}">未学習</button>
      <button data-action="status" data-s="review" class="${st==='review'?'sel':''}">復習中</button>
      <button data-action="status" data-s="done" class="${st==='done'?'sel':''}">覚えた</button>
    </div>
  </article>`;
}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}

function render(){
  const arr=filtered(), pages=Math.max(1,Math.ceil(arr.length/PAGE_SIZE));
  if(page>=pages) page=pages-1;
  const slice=arr.slice(page*PAGE_SIZE,(page+1)*PAGE_SIZE);
  $('#count').textContent=`該当 ${arr.length}語 / 全$1200語`;
  $('#cards').innerHTML=slice.map(card).join('');
  $('#empty').style.display=arr.length?'none':'block';
  $('#pageInfo').textContent=`${page+1} / ${pages}`;
  $('#prev').disabled=page<=0; $('#next').disabled=page>=pages-1;
  const pager=$('#pager'); pager.innerHTML='';
  for(let p=0;p<pages;p++){
    const b=document.createElement('button');
    const a=p*PAGE_SIZE+1, z=Math.min((p+1)*PAGE_SIZE,arr.length);
    b.textContent=`${a}–${z}`;
    if(p===page)b.classList.add('active');
    b.onclick=()=>{page=p;render();scrollTo({top:0,behavior:'smooth'})};
    pager.appendChild(b);
  }
  document.querySelectorAll('.card').forEach((el,k)=>{
    const x=slice[k];
    el.addEventListener('click',e=>{
      const b=e.target.closest('button'); if(!b)return;
      if(b.dataset.action==='answer'){
        el.querySelector('.answer').classList.toggle('show');
        b.textContent=el.querySelector('.answer').classList.contains('show')?'スペイン語を隠す':'スペイン語を見る';
      } else if(b.dataset.action==='speak') speak(x.es);
      else if(b.dataset.action==='status'){
        state[x._i]=b.dataset.s; save(); render();
      }
    });
  });
}

['q','cat','status'].forEach(id=>$('#'+id).addEventListener(id==='q'?'input':'change',()=>{page=0;render()}));
$('#prev').onclick=()=>{if(page>0){page--;render();scrollTo({top:0,behavior:'smooth'})}};
$('#next').onclick=()=>{const pages=Math.ceil(filtered().length/PAGE_SIZE);if(page<pages-1){page++;render();scrollTo({top:0,behavior:'smooth'})}};
$('#saved').textContent='学習状態：読み込み済み';
render();
</script>
</body>
</html>
